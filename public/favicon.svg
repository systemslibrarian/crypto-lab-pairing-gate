<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <title>Pairing Gate</title>
  <rect width="32" height="32" rx="7" fill="#0a0e1a"/>
  <!-- pairing lines: G1 and G2 (source groups) converge into GT (target) -->
  <g stroke="#f59e0b" stroke-width="1.8" stroke-linecap="round" fill="none">
    <path d="M9 9.5 L22 16"/>
    <path d="M9 22.5 L22 16"/>
  </g>
  <!-- G1 (source) -->
  <circle cx="9" cy="9.5" r="3.4" fill="#38bdf8"/>
  <!-- G2 (source) -->
  <circle cx="9" cy="22.5" r="3.4" fill="#a78bfa"/>
  <!-- GT (target / pairing output) -->
  <circle cx="23" cy="16" r="4.6" fill="#f472b6"/>
</svg>
